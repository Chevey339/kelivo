name: Build Android APK

env:
  FLUTTER_VERSION: '3.47.1'

on:
  push:
    branches:
      - release/zenmux-android
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag'
        required: true
        default: 'v1.2.4-zenmux-android'
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.2.4-zenmux-android' }}
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Kelivo_android_${RELEASE_TAG}_${abi}.apk"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.2.4-zenmux-android' }}
          name: ${{ inputs.release_tag || 'v1.2.4-zenmux-android' }}
          prerelease: ${{ inputs.prerelease || true }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/Kelivo_android_*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/Kelivo_android_*.apk
