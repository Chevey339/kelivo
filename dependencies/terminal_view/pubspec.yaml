name: terminal_view
description: A fast terminal emulator widget for Flutter, with a VT100/xterm-compatible parser and a renderer built for mobile.
version: 0.2.1
homepage: https://github.com/Termphin/terminal_view
repository: https://github.com/Termphin/terminal_view
issue_tracker: https://github.com/Termphin/terminal_view/issues

topics:
  - terminal
  - tty
  - console
  - ssh

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  convert: ^3.0.0
  meta: ^1.3.0
  quiver: ^3.0.0
  equatable: ^2.0.3
  flutter:
    sdk: flutter
  zmodem: ^0.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.6.5
  lints: ^3.0.0
  # dart_code_metrics was dropped: it is discontinued, and its pin on an old
  # matcher held the whole dev dependency set at a version that no longer
  # resolves against the current Flutter SDK — which meant this package's own
  # test suite couldn't be run at all.
  mockito: ^5.3.1
  build_runner: ^2.1.1
